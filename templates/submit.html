{% extends "base.html" %}
{% block content %}

<div class="panel">
  <div class="panel-title">SUBMIT FINDING</div>
  <form method="POST" action="{{ url_for('submit') }}">
    <div class="form-group">
      <label>PHONE NUMBER</label>
      <input type="text" name="phone_number" placeholder="e.g. 555-7823" autocomplete="off">
    </div>
    <div class="form-group">
      <label>SYSTEM TYPE</label>
      <select name="system_type">
        <option value="unix_host">UNIX HOST</option>
        <option value="pbx">PBX</option>
        <option value="voicemail">VOICEMAIL</option>
        <option value="modem_bank">MODEM BANK</option>
        <option value="unknown">UNKNOWN</option>
      </select>
    </div>
    <div class="form-group">
      <label>NOTES</label>
      <textarea name="notes" rows="3" placeholder="describe what you found..."></textarea>
    </div>
    <div class="form-group">
      <label>SCAN YEAR</label>
      <input type="text" name="scan_year" placeholder="e.g. 1983" autocomplete="off">
    </div>
    <div class="btn-row">
      <button type="submit" class="btn">SUBMIT FINDING</button>
    </div>
  </form>
</div>

{% endblock %}
